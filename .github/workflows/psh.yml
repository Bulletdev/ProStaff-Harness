name: psh

on:
  push:
    paths: ["psh/**", ".github/workflows/psh.yml"]
  pull_request:
    paths: ["psh/**", ".github/workflows/psh.yml"]

defaults:
  run:
    working-directory: psh

jobs:
  check:
    # R11.4 pede a matriz Linux + macOS na v1.0; ela ja entra aqui porque o
    # custo de manter e zero e o custo de descobrir divergencia depois nao e.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - run: bun install --frozen-lockfile

      - name: typecheck
        run: bun run typecheck

      # R2.14: new RegExp recebendo variavel derruba o build.
      - name: verificacao estatica de path em regex
        run: bun run lint:regex

      # R11.2c: todo arquivo em tests/ roda por glob, nunca por lista enumerada.
      - name: testes
        run: bun test --coverage

      - name: binario
        run: bun run build

      # O proprio binario precisa responder fora do runner de teste: as falhas
      # mais provaveis (instalacao incompleta) sao as que impedem o diagnostico
      # de rodar de dentro (R10.2b).
      - name: fumaca do binario
        run: |
          ./dist/psh --version
          ./dist/psh help

  # A tabela de plataformas do README afirma que Windows funciona via WSL2.
  # Afirmacao de README que ninguem exercita e a mesma classe de problema que
  # este projeto existe para resolver, entao ela roda no CI.
  wsl2:
    runs-on: windows-2022
    defaults:
      run:
        shell: wsl-bash {0}
        working-directory: psh
    steps:
      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: curl unzip ca-certificates git bubblewrap

      - uses: actions/checkout@v4

      # Sem `curl | sh`: baixa o release e confere o checksum publicado.
      # O proprio harness bloqueia esse padrao nos agentes, e instalar assim
      # aqui seria incoerente.
      - name: instalar bun
        run: |
          set -euo pipefail
          V=1.3.9
          base="https://github.com/oven-sh/bun/releases/download/bun-v${V}"
          curl -fsSL -o /tmp/bun.zip "${base}/bun-linux-x64.zip"
          curl -fsSL -o /tmp/SHASUMS256.txt "${base}/SHASUMS256.txt"
          ( cd /tmp && grep ' bun-linux-x64.zip$' SHASUMS256.txt | sha256sum -c - )
          unzip -q -o /tmp/bun.zip -d /tmp
          sudo install /tmp/bun-linux-x64/bun /usr/local/bin/bun
          bun --version

      # O que este ambiente consegue de fato. O resultado entra no log para que
      # a tabela de plataformas do README seja escrita a partir de medicao.
      - name: capacidades do kernel do WSL2
        run: |
          echo "kernel:     $(uname -sr)"
          echo "userns:     $(cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo '(sem sysctl)')"
          echo "landlock:   $(grep -c landlock /proc/kallsyms 2>/dev/null || echo 0) simbolos"
          echo "bwrap:      $(bwrap --version 2>/dev/null || echo AUSENTE)"
          echo "bwrap real: $(bwrap --ro-bind / / --dev /dev -- true 2>&1 && echo funciona || echo falhou)"

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint:regex
      - run: bun test
      - run: bun run build
      - run: ./dist/psh --version
